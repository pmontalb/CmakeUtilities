name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - gcc-debug
          - gcc-release
          - gcc-profile
          - gcc-asan
          - gcc-ubsan
          - gcc-tsan
          - gcc-asan-ubsan
          - gcc-coverage
          - gcc-lto
          - gcc-fast-math
          - gcc-lto-fast-math
          - clang-debug
          - clang-release
          - clang-profile
          - clang-asan
          - clang-ubsan
          - clang-tsan
          - clang-msan
          - clang-asan-ubsan
          - clang-coverage
          - clang-lto
          - clang-fast-math
          - clang-lto-fast-math

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compilers & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 clang-18 lld-18 ninja-build ccache libgtest-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100 --slave /usr/bin/clang++ clang++ /usr/bin/clang++-18

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.x'

      - name: Configure
        run: cmake -S . --preset=${{ matrix.preset }} -DBUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build --preset=${{ matrix.preset }}

      - name: Test
        run: ctest --preset=${{ matrix.preset }} --output-on-failure
